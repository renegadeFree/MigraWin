name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        shell: pwsh
        run: |
          dotnet run --project tests\MigraWin.Tests\MigraWin.Tests.csproj -c Release

      - name: Build MSI
        shell: pwsh
        env:
          MIGRAWIN_SIGN_PFX_BASE64: ${{ secrets.MIGRAWIN_SIGN_PFX_BASE64 }}
          MIGRAWIN_SIGN_PFX_PASSWORD: ${{ secrets.MIGRAWIN_SIGN_PFX_PASSWORD }}
        run: .\build.ps1

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $msi = "artifacts\installer\MigraWin-$version-x64.msi"
          if (-not (Test-Path -LiteralPath $msi)) {
            throw "MSI non trovato: $msi"
          }

          gh release create "${{ github.ref_name }}" `
            $msi `
            "artifacts\installer\SHA256SUMS.txt" `
            --verify-tag `
            --title "MigraWin $version" `
            --generate-notes
